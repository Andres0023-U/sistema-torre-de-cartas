<div class="min-h-[calc(100vh-56px)]" style="background:#f7f4ed">
  <div class="max-w-3xl mx-auto px-6 py-12">

    <a routerLink="/" class="text-sm text-slate-500 hover:underline">← Volver al inicio</a>

    <!-- Encabezado -->
    <div class="mt-6 mb-10">
      <p class="text-sm uppercase tracking-[0.25em] mb-3" style="color:#b08a18">
        Colección
      </p>
      <h1
        class="text-3xl md:text-4xl mb-3"
        style="font-family:'Cinzel',serif; font-weight:700; color:#0f172a">
        Mis mazos
      </h1>
      <p class="text-slate-500 text-base">
        Crea un mazo y agrégale al menos 20 cartas para poder usarlo en torneos.
      </p>
    </div>

    <!-- Crear mazo -->
    <form
      (ngSubmit)="onCreate()"
      class="relative overflow-hidden bg-white border border-slate-200 rounded-xl shadow-sm p-6 mb-10">

      <div class="absolute left-0 top-0 h-full w-1 rounded-l-xl" style="background:#c9a227"></div>

      <label class="block mb-2 text-sm font-medium text-slate-600">
        Nombre del nuevo mazo
      </label>

      <div class="flex flex-col sm:flex-row gap-3">
        <input
          [(ngModel)]="name"
          name="name"
          placeholder="Ej. Mazo Agresivo"
          required
          class="flex-1 border border-slate-300 rounded-lg px-4 py-3
                 outline-none bg-slate-50
                 focus:bg-white focus:border-[#c9a227]
                 focus:ring-1 focus:ring-[#c9a227]
                 transition-all duration-200">

        <button
          type="submit"
          [disabled]="!name.trim()"
          class="text-white px-6 py-3 rounded-lg font-medium
                 transition-all duration-200 hover:opacity-90 hover:shadow-md
                 active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed"
          style="background:#0f172a">
          Crear mazo
        </button>
      </div>
    </form>

    <!-- Lista -->
    @if (decks.length === 0) {

      <div class="relative overflow-hidden bg-white border border-slate-200 rounded-xl shadow-sm p-7">
        <div class="absolute left-0 top-0 h-full w-1 rounded-l-xl" style="background:#c9a227"></div>
        <p
          class="text-lg mb-1"
          style="font-family:'Cinzel',serif; font-weight:600; color:#0f172a">
          Aún no tienes mazos
        </p>
        <p class="text-sm text-slate-500">
          Crea el primero con el formulario de arriba.
        </p>
      </div>

    } @else {

      <div class="space-y-4">
        @for (d of decks; track d.deckId) {

          <a
            [routerLink]="['/decks', d.deckId]"
            class="group relative block p-6 bg-white border border-slate-200
                   rounded-xl shadow-sm transition-all duration-200
                   hover:-translate-y-1 hover:shadow-lg">

            <div
              class="absolute left-0 top-0 h-full w-1 rounded-l-xl
                     transition-all duration-200 group-hover:w-2"
              style="background:#c9a227">
            </div>

            <div class="flex items-center justify-between">
              <p
                class="text-lg"
                style="font-family:'Cinzel',serif; font-weight:600; color:#0f172a">
                {{ d.name }}
              </p>

              <span
                class="text-2xl ml-4 transition-transform duration-200 group-hover:translate-x-1"
                style="color:#c9a227">
                →
              </span>
            </div>
          </a>

        }
      </div>

    }

  </div>
</div>
