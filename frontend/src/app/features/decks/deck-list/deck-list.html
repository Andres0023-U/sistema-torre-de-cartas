<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Mis mazos</h1>

  <form (ngSubmit)="onCreate()" class="bg-white p-4 rounded shadow mb-6 max-w-md">
    <input [(ngModel)]="name" name="name" placeholder="Nombre del mazo" required
      class="w-full border rounded px-3 py-2 mb-2">
    <button type="submit" class="bg-slate-900 text-white px-4 py-2 rounded">
      Crear mazo
    </button>
  </form>

  <div class="grid gap-3">
    @for (d of decks; track d.deckId) {
      <a [routerLink]="['/decks', d.deckId]" class="block bg-white p-4 rounded shadow hover:bg-slate-50">
        <p class="font-semibold">{{ d.name }}</p>
      </a>
    }
  </div>
</div>
