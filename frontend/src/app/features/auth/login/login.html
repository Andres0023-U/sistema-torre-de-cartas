<div class="min-h-screen flex items-center justify-center bg-slate-100">
  <form (ngSubmit)="onSubmit()" class="bg-white p-8 rounded-lg shadow-md w-80">
    <h1 class="text-xl font-bold mb-4 text-slate-900">Iniciar sesión</h1>

    <label class="block mb-2 text-sm text-slate-700">Correo</label>
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      class="w-full border rounded px-3 py-2 mb-4"
      required
    >

    <label class="block mb-2 text-sm text-slate-700">Contraseña</label>
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      class="w-full border rounded px-3 py-2 mb-4"
      required
    >

    @if (errorMessage) {
      <p class="text-red-600 text-sm mb-4">{{ errorMessage }}</p>
    }

    <button
      type="submit"
      class="w-full bg-slate-900 text-white py-2 rounded hover:bg-slate-800"
    >
      Entrar
    </button>
  </form>
</div>
